<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="pontinhos-logo-title pontinhos-logo-desc">
  <title id="pontinhos-logo-title">Pontinhos — Logomarca e Ícone Oficial</title>
  <desc id="pontinhos-logo-desc">Emblema oficial Tactile Paper &amp; Ink do jogo Pontinhos: grade 3x3 de pontos formando 2x2 caixas, com a caixa superior esquerda capturada pelo Jogador 1 (Azul Cobalto e círculo sólido), a caixa inferior direita capturada pelo Jogador 2/Bot (Coral/Âmbar com hachura a 45 graus e losango sólido) e destaque Verde Esmeralda na última jogada.</desc>
  <defs>
    <style>
    :root {
      --bg-outer-top: #FAF9F6;
      --bg-outer-bot: #F2F1EE;
      --bg-outer-Ring: #E2E8F0;
      --card-bg: #FFFFFF;
      --card-border: #E2E8F0;
      --p1-primary: #2563EB;
      --p1-fill: #DBEAFE;
      --p1-accent: #1D4ED8;
      --p2-primary: #EA580C;
      --p2-fill: #FFEDD5;
      --p2-hatch: rgba(234, 88, 12, 0.24);
      --p2-accent: #C2410C;
      --guide: #CBD5E1;
      --emerald: #10B981;
      --emerald-ring: #FFFFFF;
      --dot: #1E293B;
    }
    </style>
    <linearGradient id="paperBgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--bg-outer-top)"/>
      <stop offset="100%" stop-color="var(--bg-outer-bot)"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-8%" width="120%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
    <pattern id="p2DiagonalHatch" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="var(--p2-hatch)" stroke-width="5"/>
    </pattern>
    <clipPath id="brBoxClip">
      <rect x="274" y="274" width="100" height="100" rx="22"/>
    </clipPath>
  </defs>

  <!-- 0. Outer Tactile Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#paperBgGrad)"/>
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="var(--bg-outer-Ring)" stroke-width="4" opacity="0.75"/>

  <!-- 1. Elevated Board Card Container -->
  <rect x="54" y="54" width="404" height="404" rx="88" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="6" filter="url(#cardShadow)"/>

  <!-- 2. Captured Boxes (Layer 1) -->
  <!-- Top-Left Box (0,0): Player 1 (Blue Fill + Solid Circle ●) -->
  <rect x="138" y="138" width="100" height="100" rx="22" fill="var(--p1-fill)"/>
  <circle cx="188" cy="188" r="25" fill="var(--p1-primary)"/>

  <!-- Bottom-Right Box (1,1): Player 2 / Bot (Coral/Amber Fill + 45° Hatching + Solid Diamond ◆) -->
  <g clip-path="url(#brBoxClip)">
    <rect x="274" y="274" width="100" height="100" rx="22" fill="var(--p2-fill)"/>
    <rect x="274" y="274" width="100" height="100" fill="url(#p2DiagonalHatch)"/>
  </g>
  <polygon points="324,295 353,324 324,353 295,324" fill="var(--p2-primary)"/>

  <!-- 3. Empty Guide Edges (Layer 2 — Top-Right & Bottom-Left open boxes) -->
  <g stroke="var(--guide)" stroke-width="10" stroke-linecap="round" stroke-dasharray="15 19" fill="none">
    <line x1="256" y1="120" x2="392" y2="120"/>
    <line x1="392" y1="120" x2="392" y2="256"/>
    <line x1="120" y1="256" x2="120" y2="392"/>
    <line x1="120" y1="392" x2="256" y2="392"/>
  </g>

  <!-- 4. Claimed Edges (Layer 3) -->
  <!-- Player 1 Edges enclosing Top-Left Box (0,0) -->
  <g stroke="var(--p1-primary)" stroke-width="20" stroke-linecap="round" fill="none">
    <line x1="120" y1="120" x2="256" y2="120"/>
    <line x1="120" y1="120" x2="120" y2="256"/>
    <line x1="256" y1="120" x2="256" y2="256"/>
    <line x1="120" y1="256" x2="256" y2="256"/>
  </g>

  <!-- Player 2 Edges enclosing Bottom-Right Box (1,1) -->
  <g stroke="var(--p2-primary)" stroke-width="20" stroke-linecap="round" fill="none">
    <line x1="392" y1="256" x2="392" y2="392"/>
    <line x1="256" y1="392" x2="392" y2="392"/>
    <line x1="256" y1="256" x2="256" y2="392"/>
  </g>

  <!-- 5. Last Move Highlight on Edge (1,1)->(1,2): (256,256) to (392,256) -->
  <line x1="256" y1="256" x2="392" y2="256" stroke="var(--emerald)" stroke-width="40" stroke-linecap="round" stroke-opacity="0.36"/>
  <line x1="256" y1="256" x2="392" y2="256" stroke="var(--p2-primary)" stroke-width="20" stroke-linecap="round"/>
  <circle cx="324" cy="256" r="11.5" fill="var(--emerald-ring)"/>
  <circle cx="324" cy="256" r="7.8" fill="var(--emerald)"/>

  <!-- 6. Grid Dots (Layer 4 — 9 vertices of the 3x3 dot matrix) -->
  <g fill="var(--dot)">
    <!-- Row 0 -->
    <circle cx="120" cy="120" r="15.5"/>
    <circle cx="256" cy="120" r="15.5"/>
    <circle cx="392" cy="120" r="15.5"/>
    <!-- Row 1 -->
    <circle cx="120" cy="256" r="15.5"/>
    <circle cx="256" cy="256" r="15.5"/>
    <circle cx="392" cy="256" r="15.5"/>
    <!-- Row 2 -->
    <circle cx="120" cy="392" r="15.5"/>
    <circle cx="256" cy="392" r="15.5"/>
    <circle cx="392" cy="392" r="15.5"/>
  </g>
</svg>
