name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# O site é servido pela branch gh-pages. A regra de proteção do environment
# github-pages rejeita jobs disparados a partir de main, então a publicação
# sincroniza docs/ direto nessa branch (contents: write).
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docs/ static site assets
        id: validate
        run: python3 .github/scripts/validate-docs-assets.py

      # enablement tenta criar o site (Source: GitHub Actions). No plano Free,
      # com repositório privado, o GITHUB_TOKEN não consegue habilitar o Pages
      # e a API responde 404/403. O step segue para o artefato ser gerado mesmo assim.
      - name: Configure GitHub Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: 'docs'

      # Publica o conteúdo de docs/ na raiz de gh-pages. Pull requests só
      # validam e empacotam; push em main e workflow_dispatch atualizam o site.
      - name: Sync docs/ to gh-pages
        id: sync
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          work=$(mktemp -d)
          git worktree add --detach "$work" origin/gh-pages
          find "$work" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a docs/. "$work/"
          touch "$work/.nojekyll"
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "gh-pages já está sincronizado com docs/."
          else
            git -C "$work" commit -m "Sync docs/ from main (${GITHUB_SHA::7})"
            git -C "$work" push origin HEAD:gh-pages
          fi

      - name: Write GitHub Pages job summary
        if: always()
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail
          {
            echo "## GitHub Pages"
            echo ""
            if [ "$VALIDATE_OUTCOME" = "success" ] && [ "$UPLOAD_OUTCOME" = "success" ] && [ "$SYNC_OUTCOME" = "success" ]; then
              echo "Os arquivos estáticos em \`docs/\` foram validados, empacotados e sincronizados com a branch \`gh-pages\`."
              echo ""
              echo "- Site: <https://regardgames.github.io/pontinhos/>"
              if [ -n "$ARTIFACT_ID" ]; then
                echo "- ID do artefato: \`$ARTIFACT_ID\`"
              fi
            elif [ "$VALIDATE_OUTCOME" = "success" ] && [ "$UPLOAD_OUTCOME" = "success" ] && [ "$SYNC_OUTCOME" = "skipped" ]; then
              echo "Os arquivos estáticos em \`docs/\` (\`index.html\`, \`privacy-policy.html\`, \`.nojekyll\` e \`store-assets/\`) foram validados e empacotados com sucesso no artefato \`github-pages\`."
              if [ -n "$ARTIFACT_ID" ]; then
                echo ""
                echo "- ID do artefato: \`$ARTIFACT_ID\`"
              fi
              echo ""
              echo "A sincronização com \`gh-pages\` roda em \`push\` ou \`workflow_dispatch\` na branch \`main\`."
            else
              echo "A validação, o empacotamento de \`docs/\` ou a sincronização com \`gh-pages\` não concluiu com sucesso, então o site não foi publicado."
              echo ""
              echo "- Validação: \`$VALIDATE_OUTCOME\`"
              echo "- Upload do artefato \`github-pages\`: \`$UPLOAD_OUTCOME\`"
              echo "- Configure GitHub Pages: \`$CONFIGURE_OUTCOME\`"
              echo "- Sync \`gh-pages\`: \`$SYNC_OUTCOME\`"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
