name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# pages: write e id-token: write são exigidos pelo deploy.
# actions: write permite o upload do artefato quando o workflow restringe o GITHUB_TOKEN.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docs/ static site assets
        id: validate
        run: python3 .github/scripts/validate-docs-assets.py

      # enablement tenta criar o site (Source: GitHub Actions). No plano Free,
      # com repositório privado, o GITHUB_TOKEN não consegue habilitar o Pages
      # e a API responde 404/403. O step segue para o artefato ser gerado mesmo assim.
      - name: Configure GitHub Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: 'docs'

      # Deploy somente com o site configurado, e apenas a partir da main.
      # Pull requests validam e empacotam docs/ sem publicar produção.
      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ success() && steps.configure.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/deploy-pages@v4

      - name: Write GitHub Pages job summary
        if: always()
        env:
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail
          {
            echo "## GitHub Pages"
            echo ""
            if [ "$CONFIGURE_OUTCOME" = "success" ] && [ "$DEPLOYMENT_OUTCOME" = "success" ]; then
              echo "Deploy publicado no GitHub Pages."
              echo ""
              if [ -n "$PAGE_URL" ]; then
                echo "- URL: <$PAGE_URL>"
              else
                echo "- URL: indisponível no output \`page_url\`."
              fi
            elif [ "$CONFIGURE_OUTCOME" != "success" ] && [ "$VALIDATE_OUTCOME" = "success" ] && [ "$UPLOAD_OUTCOME" = "success" ]; then
              echo "Os arquivos estáticos em \`docs/\` (\`index.html\`, \`privacy-policy.html\`, \`.nojekyll\` e \`store-assets/\`) foram validados e empacotados com sucesso no artefato \`github-pages\`."
              if [ -n "$ARTIFACT_ID" ]; then
                echo ""
                echo "- ID do artefato: \`$ARTIFACT_ID\`"
              fi
              echo ""
              echo "A publicação automática aguarda a ativação do GitHub Pages no repositório:"
              echo ""
              echo "- Em **Settings → Pages → Build and deployment → Source: GitHub Actions**"
              echo "- Ou ao tornar o repositório público, caso a conta utilize o plano GitHub Free"
            elif [ "$CONFIGURE_OUTCOME" = "success" ] && [ "$DEPLOYMENT_OUTCOME" != "success" ]; then
              echo "O GitHub Pages foi configurado, mas o deploy não foi publicado neste evento (status: \`$DEPLOYMENT_OUTCOME\`)."
              echo ""
              echo "O deploy de produção roda em \`push\` ou \`workflow_dispatch\` na branch \`main\`, depois que \`Configure GitHub Pages\` conclui com sucesso."
            else
              echo "A validação ou o empacotamento de \`docs/\` não concluiu com sucesso, então o site não foi publicado."
              echo ""
              echo "- Validação: \`$VALIDATE_OUTCOME\`"
              echo "- Upload do artefato \`github-pages\`: \`$UPLOAD_OUTCOME\`"
              echo "- Configure GitHub Pages: \`$CONFIGURE_OUTCOME\`"
              echo "- Deploy: \`$DEPLOYMENT_OUTCOME\`"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

